# fly.toml app configuration file generated for daily-tech-hub on 2026-09-11T19:19:36Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'daily-tech-hub'
primary_region = 'ams'

[build]

[env]
  DATA_DIR = '/data'
  HOSTNAME = '0.0.0.0'
  NODE_ENV = 'production'
  PORT = '3000'

[[mounts]]
  source = 'aurora_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
