# Aurora / Daily Tech Hub on Fly.io
# App name is set on first `fly launch` / `fly apps create`.
app = "aurora-daily-tech-hub"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  DATA_DIR = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "aurora_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
